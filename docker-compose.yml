version: "3.9"

networks:
  spark-network:

services:
  spark-master:
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: spark-instance:3.5
    container_name: spark-master-instance
    env_file:
      - aws.env
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "8083:8080" # Port for Spark UI
      - "7077:7077" # Port for Spark clusters
    volumes:
      - ./spark/jobs:/app/jobs
      - ./ivy-cache:/home/spark/.ivy2
    networks:
      - spark-network
    restart: unless-stopped

  spark-worker:
    image: spark-instance:3.5
    # container_name: spark-worker-instance
    env_file:
      - aws.env
    depends_on:
      - spark-master
    command: > 
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
    ports:
      - "8084:8081"
    volumes:
      - ./spark/jobs:/app/jobs
      - ./ivy-cache:/home/spark/.ivy2
    networks:
      - spark-network
    restart: unless-stopped

  spark-submit:
    image: spark-instance:3.5
    container_name: spark-submit-instance
    env_file:
      - aws.env
    depends_on:
      - spark-master
    volumes:
      - ./spark/jobs:/app/jobs
      - ./ivy-cache:/root/.ivy2
    networks:
      - spark-network
    entrypoint: ["spark-submit"]