version: "3.9"

networks:
  confluent:

services:
  spark-master:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: spark-master
    env_file:
      - aws.env
    volumes:
      - ./spark:/app
      - ./ivy-cache:/home/spark/.ivy2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "8083:8080"
      - "7077:7077"
    networks:
      - confluent
    restart: unless-stopped

  spark-worker:
    build:
      context: .
      dockerfile: spark/Dockerfile
    env_file:
      - aws.env
    depends_on:
      - spark-master
    command: > 
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
    ports:
      - "8084:8081"
    volumes:
      - ./spark/jobs:/app/jobs
      - ./ivy-cache:/home/spark/.ivy2
    networks:
      - confluent
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres-local
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: steam_dwh
    ports:
      - "5432:5432"
    volumes:
      - ./dwh:/dwh
      - postgres-data:/var/lib/postgresql/data
    networks:
      - confluent

volumes:
  postgres-data: 